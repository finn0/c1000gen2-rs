[package]
name = "c1000gen2-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.1"
base64 = "0.23.0"
cbc = { version = "0.2.1", features = ["alloc"] }
chrono = { version = "0.4.45", features = ["clock"] }
dotenvy = "0.15.7"
hex = "0.4.3"
md-5 = "0.11.0"
p256 = { version = "0.13", features = ["ecdh"] }
rand = "0.10.2"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rumqttc = "0.25.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs"] }
